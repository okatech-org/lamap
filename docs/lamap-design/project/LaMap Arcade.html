<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>LaMap — Arcade Mobile · couverture complète</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+SC:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="arcade/tokens.css">
  <style>
    html, body { margin: 0; padding: 0; background: var(--abyss); font-family: var(--font-body); color: var(--cream); }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Foundations -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="arcade/tweaks-panel.jsx"></script>

  <!-- Arcade primitives -->
  <script type="text/babel" src="arcade/cards3d.jsx"></script>
  <script type="text/babel" src="arcade/hud.jsx"></script>
  <script type="text/babel" src="arcade/mobile-shell.jsx"></script>

  <!-- Screens · grouped -->
  <script type="text/babel" src="arcade/m/auth.jsx"></script>
  <script type="text/babel" src="arcade/m/hub.jsx"></script>
  <script type="text/babel" src="arcade/m/game.jsx"></script>
  <script type="text/babel" src="arcade/m/economy.jsx"></script>
  <script type="text/babel" src="arcade/m/social.jsx"></script>
  <script type="text/babel" src="arcade/m/progression.jsx"></script>
  <script type="text/babel" src="arcade/m/reference.jsx"></script>
  <script type="text/babel" src="arcade/m/monetization.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { DCSection, DCArtboard, DesignCanvas } = window;
    const { useTweaks, TweaksPanel, TweakSection } = window;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "ember-royal"
    }/*EDITMODE-END*/;

    const THEMES_META = [
      { id: 'esmeralda',   label: 'Esmeralda',   sub: 'émeraude + or',         swatches: ['#1B4A3A', '#E8C879', '#F6EFDF'] },
      { id: 'ember-royal', label: 'Ember Royal', sub: 'rouge + or + bleu nuit', swatches: ['#B4443E', '#E8C879', '#465D74'] },
      { id: 'onyx',        label: 'Onyx Noir',   sub: 'charbon + champagne',    swatches: ['#1A1A1A', '#D4AF5E', '#F6EFDF'] },
      { id: 'amethyste',   label: 'Améthyste',   sub: 'aubergine + or rose',    swatches: ['#3A2A6B', '#E5B5C0', '#F6EFDF'] },
    ];

    function ThemeSwatches({ value, onChange }) {
      return (
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, padding: '4px 0' }}>
          {THEMES_META.map(theme => {
            const active = theme.id === value;
            return (
              <button key={theme.id} onClick={() => onChange(theme.id)}
                style={{
                  padding: 10, borderRadius: 10,
                  background: active ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.02)',
                  border: `1px solid ${active ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.08)'}`,
                  cursor: 'pointer', textAlign: 'left',
                  display: 'flex', flexDirection: 'column', gap: 8,
                  fontFamily: 'inherit',
                  transition: 'all 150ms ease',
                }}>
                <div style={{ display: 'flex', gap: 4 }}>
                  {theme.swatches.map((c, i) => (
                    <div key={i} style={{
                      width: 22, height: 22, borderRadius: 6,
                      background: c,
                      border: '1px solid rgba(255,255,255,0.1)',
                      boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.1)',
                    }} />
                  ))}
                </div>
                <div>
                  <div style={{ fontSize: 12, color: '#fff', fontWeight: 600, lineHeight: 1.2 }}>{theme.label}</div>
                  <div style={{ fontSize: 10, color: 'rgba(255,255,255,0.5)', marginTop: 2 }}>{theme.sub}</div>
                </div>
              </button>
            );
          })}
        </div>
      );
    }

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      React.useEffect(() => {
        document.documentElement.setAttribute('data-theme', t.theme);
      }, [t.theme]);

      return (
        <>
          <DesignCanvas
            title="LaMap — Arcade"
            subtitle="Refonte mobile · modèle éco Kora intégré · 4 thèmes de couleurs (Tweaks)"
          >
          <DCSection
            id="01-auth"
            title="01 · Accueil & découverte"
            subtitle="Connexion + parcours d'onboarding en 4 temps."
          >
            <DCArtboard id="auth"      label="1.1 Connexion / inscription"   width={390} height={844}><MAuth /></DCArtboard>
            <DCArtboard id="onboard-1" label="1.2 Onboarding — bienvenue"     width={390} height={844}><MOnboard1 /></DCArtboard>
            <DCArtboard id="onboard-2" label="1.3 Onboarding — règles"        width={390} height={844}><MOnboard2 /></DCArtboard>
            <DCArtboard id="onboard-3" label="1.4 Onboarding — Kora"          width={390} height={844}><MOnboard3 /></DCArtboard>
            <DCArtboard id="onboard-4" label="1.5 Onboarding — première partie" width={390} height={844}><MOnboard4 /></DCArtboard>
          </DCSection>

          <DCSection
            id="02-hub"
            title="02 · Hub & navigation"
            subtitle="Le quotidien du joueur. Hub épuré (avec CTA bonus + pub), modes, lobby tables par tier, matchmaking, lobby privé."
          >
            <DCArtboard id="hub"          label="2.1 Hub d'accueil"          width={390} height={844}><MHub /></DCArtboard>
            <DCArtboard id="mode-select"  label="2.2 Choisir un mode"        width={390} height={844}><MModeSelect /></DCArtboard>
            <DCArtboard id="tables"       label="2.3 Tables · Découverte / Standard / VIP" width={390} height={844}><MTables /></DCArtboard>
            <DCArtboard id="matchmaking"  label="2.4 Recherche d'adversaire" width={390} height={844}><MMatchmaking /></DCArtboard>
            <DCArtboard id="private-lobby" label="2.5 Salon privé · code"    width={390} height={844}><MPrivateLobby /></DCArtboard>
          </DCSection>

          <DCSection
            id="03-game"
            title="03 · Gameplay"
            subtitle="La table, le moment KORA, et la fin de match."
          >
            <DCArtboard id="match"   label="3.1 Match en cours · main 3"   width={390} height={844}><MMatch /></DCArtboard>
            <DCArtboard id="kora"    label="3.2 KORA ×2 · cinématique"     width={390} height={844}><MKora /></DCArtboard>
            <DCArtboard id="endgame" label="3.3 Fin de match · victoire"   width={390} height={844}><MEndGame /></DCArtboard>
          </DCSection>

          <DCSection
            id="04-economy"
            title="04 · Économie Kora"
            subtitle="Boutique, wallet (non-encaissable), packs aux vrais prix, rebuy, pub récompensée, bonus quotidien, flow mobile money."
          >
            <DCArtboard id="shop"    label="4.1 Boutique cosmétiques" width={390} height={844}><MShop /></DCArtboard>
            <DCArtboard id="inspect" label="4.2 Inspection de carte"  width={390} height={844}><MInspect /></DCArtboard>
            <DCArtboard id="wallet"  label="4.3 Mes Kora · wallet"    width={390} height={844}><MWallet /></DCArtboard>
            <DCArtboard id="topup"   label="4.4 Acheter des Kora"     width={390} height={844}><MTopUp /></DCArtboard>
            <DCArtboard id="rebuy"   label="4.5 Plus de Kora · Rebuy ★" width={390} height={844}><MRebuy /></DCArtboard>
            <DCArtboard id="ad"      label="4.6 Pub récompensée"      width={390} height={844}><MAdReward /></DCArtboard>
            <DCArtboard id="daily"   label="4.7 Bonus quotidien · streak" width={390} height={844}><MDailyBonus /></DCArtboard>
            <DCArtboard id="momo"    label="4.8 Mobile Money · saisie" width={390} height={844}><MMobileMoney /></DCArtboard>
            <DCArtboard id="success" label="4.9 Recharge réussie"     width={390} height={844}><MTopupSuccess /></DCArtboard>
          </DCSection>

          <DCSection
            id="05-social"
            title="05 · Social"
            subtitle="Amis, profil public, classement, notifications."
          >
            <DCArtboard id="friends"     label="5.1 Amis · en ligne / off"   width={390} height={844}><MFriends /></DCArtboard>
            <DCArtboard id="other"       label="5.2 Profil d'un autre joueur" width={390} height={844}><MOtherProfile /></DCArtboard>
            <DCArtboard id="leaderboard" label="5.3 Classement · podium"      width={390} height={844}><MLeaderboard /></DCArtboard>
            <DCArtboard id="notifs"      label="5.4 Notifications · inbox"    width={390} height={844}><MNotifications /></DCArtboard>
          </DCSection>

          <DCSection
            id="06-progression"
            title="06 · Progression"
            subtitle="Profil, passe de saison détaillé, historique des matchs."
          >
            <DCArtboard id="profile" label="6.1 Mon profil"        width={390} height={844}><MProfile /></DCArtboard>
            <DCArtboard id="season"  label="6.2 Passe de saison"  width={390} height={844}><MSeason /></DCArtboard>
            <DCArtboard id="history" label="6.3 Historique matchs" width={390} height={844}><MHistory /></DCArtboard>
          </DCSection>

          <DCSection
            id="07-reference"
            title="07 · Référence & paramètres"
            subtitle="Règles, glossaire (Kora, Bandi), réglages du compte."
          >
            <DCArtboard id="rules"    label="7.1 Règles & glossaire" width={390} height={844}><MRules /></DCArtboard>
            <DCArtboard id="settings" label="7.2 Paramètres"          width={390} height={844}><MSettings /></DCArtboard>
          </DCSection>

          <DCSection
            id="08-engagement"
            title="08 · Tournois, social & statut"
            subtitle="Tournois (lots réels gratuits + buy-in Kora), cadeaux entre amis, Pass VIP — tout le levier rétention & statut."
          >
            <DCArtboard id="tournaments"  label="8.1 Tournois · liste"          width={390} height={844}><MTournaments /></DCArtboard>
            <DCArtboard id="tournament-d" label="8.2 Tournoi gratuit · détail"  width={390} height={844}><MTournamentDetail /></DCArtboard>
            <DCArtboard id="gift"         label="8.3 Offrir des Kora"           width={390} height={844}><MGiftKora /></DCArtboard>
            <DCArtboard id="vip"          label="8.4 Pass VIP · abonnement"     width={390} height={844}><MVIP /></DCArtboard>
          </DCSection>
        </DesignCanvas>

        <TweaksPanel>
          <TweakSection label="Thème de couleurs" />
          <div style={{ padding: '0 4px', marginTop: -4 }}>
            <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.55)', marginBottom: 10, lineHeight: 1.45 }}>
              Bascule entre 4 directions. Esmeralda est l'actuelle ; Ember Royal réutilise la palette d'origine rouge/or/bleu.
            </div>
            <ThemeSwatches value={t.theme} onChange={(v) => setTweak('theme', v)} />
          </div>
        </TweaksPanel>
      </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
