name: Build iOS + App Store

# Builds the iOS app on EAS Build and optionally submits the same build to
# App Store Connect. The signed IPA remains in EAS instead of being published
# as a downloadable artifact on the public GitHub repository.
#
# Triggers
#   • Manual: pick a profile + opt-in App Store submission.
#   • Tag push: pushing a `v*` tag builds the production app. App Store
#     submission remains manual after TestFlight.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "production"
        type: choice
        options:
          - preview
          - production
      submit_to_app_store:
        description: "Submit the build to App Store Connect after upload"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS build (+ App Store)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Expo + EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies (workspace root)
        run: bun install --frozen-lockfile

      - name: Resolve build profile + submit flag
        id: opts
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "submit=false" >> "$GITHUB_OUTPUT"
          else
            echo "profile=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
            echo "submit=${{ inputs.submit_to_app_store }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build iOS IPA on EAS
        id: eas
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          eas build \
            --platform ios \
            --profile "${{ steps.opts.outputs.profile }}" \
            --non-interactive \
            --json > build.json
          jq '.' build.json
          BUILD_ID=$(jq -r '.[0].id' build.json)
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::EAS build did not return a build ID"
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Publish build summary
        run: |
          {
            echo "## iOS build"
            echo "- Profile: \`${{ steps.opts.outputs.profile }}\`"
            echo "- EAS build: https://expo.dev/accounts/okatechs-organization/projects/lamap/builds/${{ steps.eas.outputs.build_id }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- App Store submission: \`${{ steps.opts.outputs.submit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit to App Store Connect
        if: steps.opts.outputs.submit == 'true'
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          eas submit \
            --platform ios \
            --profile production \
            --id "${{ steps.eas.outputs.build_id }}" \
            --non-interactive
